[package]
name = "ssms-search-rs"
version = "0.7.0-alpha.1"
edition = "2021"
description = "SSMS-inspired Object Explorer + Query + Execution Plan (egui) — alpha"
license = "MIT"
publish = false

[lib]
name = "ssms_search_rs"
path = "src/lib.rs"

[[bin]]
name = "ssms-search-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["chrono", "native-tls", "tds73", "winauth"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
