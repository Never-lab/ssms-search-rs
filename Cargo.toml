[package]
name = "ssms-search-rs"
version = "0.7.0-alpha.1"
edition = "2021"
description = "SSMS-inspired Object Explorer + Query + Execution Plan (egui) — alpha"
license = "MIT"
publish = false

[lib]
name = "ssms_search_rs"
path = "src/lib.rs"

[[bin]]
name = "ssms-search-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
# Pinned: 0.x API (same choice as Quervio — Messages, cancel, SSPI, money).
mssql-tds = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
